<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>VSCode Switcher — app icon</title>
  <!--
    What the app does, drawn literally: a list of VSCode windows that has just
    slid in from the left screen edge, every row tagged with the Peacock colour
    of its window. The rows start off-canvas so the squircle trims their left
    ends — that trim is what sells the "slid in from the edge" reading.

    Grid: Big Sur. The tile is 824x824 centred on a 1024x1024 canvas, corner
    radius 185.8 with Apple-style continuous corners (a squircle, not a plain
    rounded rect), plus a baked drop shadow — .icns icons get no shadow from
    the dock.

    Colours are real Peacock colours from the user's projects.
    This file is used for 128px and up; icon-small.svg covers 16/32 (and their
    @2x renders), where five rows would collapse into mush.
  -->
  <defs>
    <!-- Continuous-corner squircle: 824x824 at (100,100), r=185.8, smoothing 0.6. -->
    <path id="tile" d="M 626.72 100 c 104.06 0 156.09 0 195.83 20.25 a 185.8 185.8 0 0 1 81.2 81.2 c 20.25 39.74 20.25 91.77 20.25 195.83 L 924 626.72 c 0 104.06 0 156.09 -20.25 195.83 a 185.8 185.8 0 0 1 -81.2 81.2 c -39.74 20.25 -91.77 20.25 -195.83 20.25 L 397.28 924 c -104.06 0 -156.09 0 -195.83 -20.25 a 185.8 185.8 0 0 1 -81.2 -81.2 c -20.25 -39.74 -20.25 -91.77 -20.25 -195.83 L 100 397.28 c 0 -104.06 0 -156.09 20.25 -195.83 a 185.8 185.8 0 0 1 81.2 -81.2 c 39.74 -20.25 91.77 -20.25 195.83 -20.25 Z"/>

    <!-- VSCode dark theme in spirit, lifted a little so the tile does not
         disappear into a dark dock. -->
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a43"/>
      <stop offset="0.55" stop-color="#252529"/>
      <stop offset="1" stop-color="#18181c"/>
    </linearGradient>

    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>

    <clipPath id="tileClip">
      <use href="#tile"/>
    </clipPath>
  </defs>

  <use href="#tile" fill="url(#plate)" filter="url(#tileShadow)"/>

  <g clip-path="url(#tileClip)">
    <!-- Row 1 is the selected window: brighter, bluish background and a
         near-white title, same as the live panel. -->
    <g>
      <rect x="40" y="232" width="798" height="92" rx="24" fill="#464b60"/>
      <rect x="40" y="232" width="132" height="92" rx="24" fill="#e2681c"/>
      <rect x="216" y="265" width="330" height="26" rx="13" fill="#d5d7de"/>
    </g>
    <g>
      <rect x="40" y="349" width="798" height="92" rx="24" fill="#3b3b46"/>
      <rect x="40" y="349" width="132" height="92" rx="24" fill="#1857a4"/>
      <rect x="216" y="382" width="256" height="26" rx="13" fill="#a5a6b1"/>
    </g>
    <g>
      <rect x="40" y="466" width="798" height="92" rx="24" fill="#3b3b46"/>
      <rect x="40" y="466" width="132" height="92" rx="24" fill="#58c045"/>
      <rect x="216" y="499" width="386" height="26" rx="13" fill="#a5a6b1"/>
    </g>
    <g>
      <rect x="40" y="583" width="798" height="92" rx="24" fill="#3b3b46"/>
      <rect x="40" y="583" width="132" height="92" rx="24" fill="#a43683"/>
      <rect x="216" y="616" width="292" height="26" rx="13" fill="#a5a6b1"/>
    </g>
    <g>
      <rect x="40" y="700" width="798" height="92" rx="24" fill="#3b3b46"/>
      <rect x="40" y="700" width="132" height="92" rx="24" fill="#d3ba41"/>
      <rect x="216" y="733" width="222" height="26" rx="13" fill="#a5a6b1"/>
    </g>
  </g>

  <!-- Rim light: keeps the tile's silhouette readable against a dark dock. -->
  <use href="#tile" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
</svg>
